name: Generative Engine Pipeline Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Scraper Test
      run: |
        python backend/scraper.py

    - name: Run Analyzer Matrix Test
      run: |
        python backend/analyzer.py

    - name: Verify Data Rules JSON
      run: |
        test -f backend/data_rules.json && echo "data_rules.json successfully generated!"
